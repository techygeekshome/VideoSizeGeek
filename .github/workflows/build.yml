name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The whole solution is plain net8.0 and builds on Linux, Avalonia included, so the
      # checks run on a cheap runner. VideoSizeGeek.Core carries the part worth proving - the
      # bitrate budget math, the ffprobe JSON parsing, and a real end-to-end ffmpeg encode
      # since this runner does have ffmpeg on it - and none of that touches Windows.
      - name: Build
        run: dotnet build VideoSizeGeek.sln -c Release

      - name: Test
        run: dotnet run --project tests/VideoSizeGeek.Tests -c Release --no-build
